<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Users (Express + Vue + SQLite)</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app" class="container">
    <header class="page-header">
      <h1>Users</h1>
      <button class="add-user" type="button" @click="startAddUser">Add User</button>
    </header>

    <div v-if="isUserModalOpen" class="modal-backdrop">
      <section class="user-modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
        <h2 id="user-modal-title">{{ editingUser ? 'Edit User' : 'Add User' }}</h2>
        <user-form :user-to-edit="editingUser" :saving="isSaving" @submit="handleSubmit" @cancel="cancelEdit"></user-form>
      </section>
    </div>

    <user-list :users="users" @edit="editUser" @delete="removeUser"></user-list>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
